name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies (using npx to avoid global installs)
        run: npx --yes @lhci/cli@0.11.0 --version

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.11.0 autorun --config=lighthouserc.json
