name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Chromium (to provide headless browser for Lighthouse)
        run: |
          set -e
          echo "Updating apt and attempting to install chromium packages"
          sudo apt-get update -y || true
          sudo apt-get install -y chromium chromium-browser || true
          echo "Checking for available browser binaries"
          for CHROME in chromium-browser chromium google-chrome-stable; do
            if command -v "$CHROME" >/dev/null 2>&1; then
              echo "Found browser binary: $CHROME -> $(command -v $CHROME)"
              echo "CHROME_PATH=$(command -v $CHROME)" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "${CHROME_PATH:-}" ]; then
            echo "Warning: No Chromium/Chrome binary found in PATH. LHCI may attempt to use a downloaded chromium or fail later. Continuing to LHCI step for additional debugging."
            # Print available binaries for debugging
            echo "Which chromium-browser: $(which chromium-browser || echo 'not found')"
            echo "Which chromium: $(which chromium || echo 'not found')"
            echo "Which google-chrome-stable: $(which google-chrome-stable || echo 'not found')"
            echo "Listing /usr/bin for debugging:"; ls -la /usr/bin | grep -i chrome || true
          else
            echo "Using CHROME_PATH=${CHROME_PATH}"
          fi

      - name: Install LHCI CLI (npx wrapper)
        run: npx --yes @lhci/cli@0.11.0 --version

      - name: Run Lighthouse CI (non-fatal)
        continue-on-error: true
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          echo "Starting LHCI autorun (logs are non-fatal)"
          npx --yes @lhci/cli@0.11.0 autorun --config=lighthouserc.json --chrome-flags="--no-sandbox" || {
            echo "LHCI autorun exited with non-zero status; collecting debug info"
            echo "LHCI version: $(npx --yes @lhci/cli@0.11.0 --version 2>&1 || true)"
            ls -la $(dirname "${CHROME_PATH:-/usr/bin}") || true
            echo "CHROME_PATH=${CHROME_PATH:-not set}"
            exit 0
          }
