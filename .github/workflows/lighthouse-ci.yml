name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Chromium (to provide headless browser for Lighthouse)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium chromium-browser || true
          for CHROME in chromium-browser chromium google-chrome-stable; do
            if command -v "$CHROME" >/dev/null 2>&1; then
              echo "CHROME_PATH=$(command -v $CHROME)" >> "$GITHUB_ENV"
              echo "Using browser: $CHROME"
              exit 0
            fi
          done
          echo "No Chromium/Chrome binary found in PATH"
          exit 1

      - name: Install LHCI CLI (npx wrapper)
        run: npx --yes @lhci/cli@0.11.0 --version

      - name: Run Lighthouse CI
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: npx --yes @lhci/cli@0.11.0 autorun --config=lighthouserc.json --chrome-flags="--no-sandbox"
