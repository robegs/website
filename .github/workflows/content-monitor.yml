name: Content Monitor

on:
  schedule:
    # Approx. every 15 days (1st and 16th of each month) at 06:00 UTC
    - cron: "0 6 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check monitored sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_content_updates.py || rc=$?
          rc=${rc:-0}
          if [ "$rc" -eq 10 ]; then
            echo "CHANGES_DETECTED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$rc" -eq 0 ]; then
            echo "CHANGES_DETECTED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          exit "$rc"

      - name: Commit updated monitoring state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(monitor): update content snapshot"
          file_pattern: monitoring/last_snapshot.json monitoring/latest_report.md

      - name: Open issue when changes are detected
        if: env.CHANGES_DETECTED == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Content update detected - review website content"
          content-filepath: monitoring/latest_report.md
          labels: |
            content-update
            maintenance
